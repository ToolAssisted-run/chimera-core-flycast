name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package. Both jobs run
# only over the homebrew movie set vendored in tests/ (free to distribute)
# plus a synthesized Sega CD disc, so they need nothing provisioned and run
# on public runners.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the
    # same sources built for the host, and survive a savestate round-trip
    # around every frame. No .NET, Mono or X involved.
    name: core gate (native == sandbox == rerecord)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3 bison flex pkg-config

      - name: Check out what the core actually compiles
        # Flycast is a big tree with many submodules and this core uses one of
        # them: libchdr, which reads CHD discs and brings its own zlib, zstd and
        # lzma. The rest - SDL, Vulkan headers, breakpad, asio - belong to the
        # desktop application (see waterbox/sources.sh) and are never fetched.
        run: git submodule update --init --recursive --depth 1 extern/flycast/core/deps/libchdr

      - name: Check out miniBox and the guest Mesa
        working-directory: chimera-checkout
        run: |
          git submodule update --init extern/tools/chimera-common-minibox
          git submodule update --init extern/tools/mesa-guest

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          # the host library, plus the C++ guest toolchain Flycast needs
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the guest Mesa (softpipe + OSMesa) the GL renderer links
        # Turns the shipped core into the hardware OpenGL build. Needs the
        # meson-cpp guest sysroot from the miniBox step above; bash, not sh,
        # because the script uses `set -o pipefail`.
        run: |
          MINIBOX_DIR="$PWD/chimera-checkout/extern/tools/chimera-common-minibox" \
            bash chimera-checkout/extern/tools/build-guest-mesa.sh

      - name: Build the native reference and sandbox drivers
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          MINIBOX_DIR="$PWD/chimera-checkout/extern/tools/chimera-common-minibox" sh waterbox/setup-guest.sh \
            -- -Dminibox_dir="$PWD/chimera-checkout/extern/tools/chimera-common-minibox" \
               -Dmesa_guest_dir="$PWD/chimera-checkout/extern/tools/mesa-guest"
          ninja -C build/meson-guest

      - name: Core gate over the homebrew movie set
        run: ./waterbox/run-gate.sh


      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            build/meson-guest/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera
    # headless under Mono + Xvfb, through the generic waterbox adapter). The
    # emulated 68K RAM must match the native reference, a setting must arrive
    # through the frontend's config, and the package's default keybinds must
    # become the frontend's.
    name: frontend gate (Chimera)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 bison flex \
            mono-complete xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera native dependencies
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the Chimera solution
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Check out what the core actually compiles
        run: git submodule update --init --recursive --depth 1 extern/flycast/core/deps/libchdr

      - name: Build the native reference
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          # run-native only: the frontend gate compares Chimera against the
          # native reference and never runs the sandbox driver, which would
          # drag in a miniBox host build this job has no reason to do.
          ninja -C build/meson-native run-native

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          # the host library, plus the C++ guest toolchain Flycast needs
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the guest Mesa (softpipe + OSMesa) the GL renderer links
        # The published package is the hardware OpenGL build: build-package.sh
        # defaults -Dmesa_guest_dir to <chimera>/extern/tools/mesa-guest, which
        # the recursive chimera checkout already vendored. bash, not sh.
        run: |
          MINIBOX_DIR="$PWD/chimera-checkout/extern/tools/chimera-common-minibox" \
            bash chimera-checkout/extern/tools/build-guest-mesa.sh

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/tools/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Publish the core package
        # one core.wbx, one package, four machines inside it
        uses: actions/upload-artifact@v7
        with:
          name: flycast-${{ github.sha }}
          path: chimera-checkout/build/Cores/flycast.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/
